<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080909" />
    <meta name="color-scheme" content="dark light" />
    <script>
      /* Apply the saved / system theme before first paint to avoid a flash. */
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var light = saved ? saved === "light" : window.matchMedia("(prefers-color-scheme: light)").matches;
          if (light) {
            document.documentElement.classList.add("theme-light");
            document.documentElement.style.colorScheme = "light";
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#e9e8e1");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Gilbert Muhire is a software engineer building useful products, reliable systems, and thoughtful digital experiences." />
    <title>Gilbert Muhire — Software Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
